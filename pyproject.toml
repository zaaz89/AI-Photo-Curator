[project]
name = "ai-photo-curator"
version = "0.1.0"
description = "Local-first photo curator for multi-person travel collections (fork of kotyzap/Photo-Curator v7.0)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "Flask>=3.1.3",
    "Werkzeug>=3.1.9",
    "Pillow>=12.2",
    "numpy>=1.26.4,<2",
    "opencv-python-headless==4.10.0.84",
    "rawpy>=0.21,<1.0",
    "pillow-heif>=1.3.0,<2.0",
    "torch>=2.15.0",
    "transformers>=5.22.2",
    "sentencepiece>=0.2.3",
    "protobuf>=7.36.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
