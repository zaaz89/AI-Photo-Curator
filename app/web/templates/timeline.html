<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline · Photo Curator</title>
<style>
  :root{--bg:#f4f6fb;--panel:#fff;--panel2:#eef1f7;--text:#1c2330;--muted:#6b7280;
        --accent:#2563eb;--warn:#b45309;--bad:#dc2626;--border:#dde3ec;--shadow:rgba(20,40,80,.10);color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f141c;--panel:#161d28;--panel2:#1d2633;--text:#e8edf5;
        --muted:#9aa6b6;--accent:#3b82f6;--warn:#f59e0b;--bad:#f87171;--border:#27313f;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
  :root[data-theme=dark]{--bg:#0f141c;--panel:#161d28;--panel2:#1d2633;--text:#e8edf5;
        --muted:#9aa6b6;--accent:#3b82f6;--warn:#f59e0b;--bad:#f87171;--border:#27313f;--shadow:rgba(0,0,0,.5);color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums}
  a{color:var(--accent)}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
  .top h1{font-size:16px;margin:0;font-weight:650}
  .top .back{color:var(--muted);text-decoration:none}
  .top .spacer{flex:1}
  .iconbtn{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer}
  .layout{display:flex;min-height:calc(100vh - 50px)}
  .side{width:320px;flex:0 0 320px;background:var(--panel);border-right:1px solid var(--border);padding:18px;display:flex;flex-direction:column;gap:22px;
        position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto}
  .side h2{font-size:13px;font-weight:650;margin:0 0 8px;color:var(--muted)}
  .field{display:flex;gap:6px;margin-top:6px}
  input[type=text],select{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--panel2)}
  .btn{padding:8px 12px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
  .source{display:grid;grid-template-columns:10px 1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
  .source:last-child{border-bottom:none}
  .swatch{width:10px;height:10px;border-radius:3px}
  .source input{padding:3px 6px;border:1px solid transparent;background:transparent;border-radius:6px;font-weight:600;width:100%}
  .source input:hover,.source input:focus{border-color:var(--border);background:var(--panel2)}
  .source .path{grid-column:2/4;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .source .n{font-size:12px;color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);margin:6px 0 0}
  .bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:8px}
  .bar div{height:100%;width:0;background:var(--accent);transition:width .2s}
  .status{font-size:12px;color:var(--muted);margin-top:6px;word-break:break-word}
  main{flex:1;min-width:0;padding:18px 24px 60px}
  .summary{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:6px}
  .summary .big{font-size:22px;font-weight:700}
  .legend{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--border);font-size:12px}
  .conf{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 18px;font-size:12px;color:var(--muted)}
  .day{margin-top:26px}
  .day h3{position:sticky;top:50px;z-index:2;margin:0;padding:8px 0;background:var(--bg);font-size:17px;font-weight:650;border-bottom:1px solid var(--border)}
  .day h3 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
  .hour{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-bottom:1px dashed var(--border)}
  .hour .h{font-size:20px;font-weight:300;color:var(--muted);line-height:1;padding-top:4px}
  .tiles{display:flex;flex-wrap:wrap;gap:8px}
  .tile{width:136px;border:0;padding:0;background:var(--panel);border-radius:8px;overflow:hidden;cursor:pointer;text-align:left;position:relative;box-shadow:0 1px 2px var(--shadow)}
  .tile .img{display:block;width:136px;height:102px;object-fit:cover;background:var(--panel2)}
  .tile .vid{display:flex;align-items:center;justify-content:center;width:136px;height:102px;background:var(--panel2);color:var(--muted);font-size:12px}
  .tile .meta{display:flex;align-items:center;gap:6px;padding:4px 7px 5px;border-top:4px solid var(--lane);font-size:12px}
  .tile .t{font-weight:600}
  .tile .who{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile.medium .t::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:1px}
  .tile.low,.tile.unknown{outline:2px dashed var(--bad);outline-offset:-2px}
  .tile.sel{outline:3px solid var(--accent);outline-offset:-3px}
  .flag{position:absolute;top:5px;left:5px;padding:1px 6px;border-radius:5px;font-size:11px;background:rgba(0,0,0,.65);color:#fff}
  .empty{max-width:520px;margin:12vh auto;text-align:center;color:var(--muted)}
  .empty strong{display:block;font-size:18px;color:var(--text);margin-bottom:6px}
  #detail{position:fixed;right:0;top:50px;bottom:0;width:380px;max-width:100vw;background:var(--panel);border-left:1px solid var(--border);
          box-shadow:-8px 0 24px var(--shadow);padding:18px;overflow:auto;transform:translateX(100%);transition:transform .18s;z-index:6}
  #detail.open{transform:none}
  #detail img{width:100%;border-radius:8px;background:var(--panel2)}
  #detail dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px;margin:14px 0}
  #detail dt{color:var(--muted)} #detail dd{margin:0;word-break:break-word}
  #detail ul{margin:4px 0 0;padding-left:18px;font-size:13px}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.high{background:color-mix(in srgb,#16a34a 18%,transparent);color:#15803d}
  .pill.medium{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
  .pill.low,.pill.unknown{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
  @media (max-width:860px){.layout{flex-direction:column} .side{width:auto;flex:none;position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}
    main{padding:14px 16px 60px} .hour{grid-template-columns:44px 1fr} .tile,.tile .img,.tile .vid{width:calc(50vw - 50px)}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div class="top">
  <a class="back" href="/">← Curator</a>
  <h1>Timeline</h1>
  <span class="spacer"></span>
  <button class="iconbtn" id="theme" aria-label="Switch light or dark">◐</button>
</div>
<div class="layout">
  <aside class="side">
    <section>
      <h2>Collection</h2>
      <select id="coll" aria-label="Collection"></select>
      <div class="field"><input type="text" id="newName" placeholder="New collection, e.g. Tuscany 2026">
        <button class="btn ghost" id="create">Create</button></div>
    </section>
    <section id="srcBox" hidden>
      <h2>Sources</h2>
      <div id="sources"></div>
      <div class="field"><input type="text" id="owner" placeholder="Whose photos? e.g. Andraž"></div>
      <div class="field"><input type="text" id="path" placeholder="Folder path (or use Browse)">
        <button class="btn ghost" id="browse">Browse</button></div>
      <div class="field"><button class="btn ghost" id="add" style="width:100%">Add source</button></div>
      <p class="hint">Source folders are only read. Nothing is written into them.</p>
    </section>
    <section id="idxBox" hidden>
      <button class="btn" id="index" style="width:100%">Index photos</button>
      <div class="bar"><div id="fill"></div></div>
      <div class="status" id="status"></div>
    </section>
  </aside>
  <main id="main"><div class="empty"><strong>No collection yet</strong>Create a collection, add a folder for each person or device, then index it.</div></main>
</div>
<aside id="detail" aria-live="polite"></aside>
<script>
const LANES=['#0d9488','#d97706','#7c3aed','#e11d48','#0284c7','#65a30d'];
const CONF_TEXT={high:'Exact capture time',medium:'Time zone assumed',low:'Camera clock only, time zone unknown',unknown:'No capture time in the file'};
let cid=null, data=null, sources=[], polling=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(url,opt={})=>fetch(url,{headers:{'Content-Type':'application/json'},...opt}).then(r=>r.json());
const lane=id=>LANES[(sources.findIndex(s=>s.id===id)+LANES.length)%LANES.length];

try{const t=localStorage.getItem('pc-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
$('#theme').onclick=()=>{const dark=getComputedStyle(document.documentElement).colorScheme==='dark';
  const t=dark?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('pc-theme',t);}catch(e){}};

async function loadCollections(select){
  const d=await api('/api/collections');const list=d.collections||[];
  $('#coll').innerHTML=list.length?list.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} (${c.assets})</option>`).join(''):'<option value="">No collections</option>';
  if(select)$('#coll').value=select;
  cid=$('#coll').value||null;
  $('#srcBox').hidden=$('#idxBox').hidden=!cid;
  if(cid){await loadSources();await loadTimeline();checkJob();}
}
$('#coll').onchange=()=>{cid=$('#coll').value;loadSources().then(loadTimeline);};
$('#create').onclick=async()=>{const name=$('#newName').value.trim();if(!name){$('#newName').focus();return;}
  const d=await api('/api/collections',{method:'POST',body:JSON.stringify({name})});
  if(d.error){status(d.error,true);return;} $('#newName').value='';loadCollections(d.id);};

async function loadSources(){
  const d=await api(`/api/collections/${cid}/sources`);sources=d.sources||[];
  $('#sources').innerHTML=sources.length?sources.map(s=>`<div class="source">
      <span class="swatch" style="background:${lane(s.id)}"></span>
      <input value="${esc(s.owner)}" data-id="${s.id}" aria-label="Owner of ${esc(s.path)}">
      <span class="n">${s.assets} files</span>
      <span class="path" title="${esc(s.path)}">${esc(s.path)}</span></div>`).join('')
    :'<p class="hint">Add one folder per person or device.</p>';
  document.querySelectorAll('.source input').forEach(i=>i.onchange=()=>api(`/api/collections/${cid}/sources/${i.dataset.id}`,
    {method:'PATCH',body:JSON.stringify({owner:i.value})}).then(()=>{loadSources();loadTimeline();}));
}
async function addSource(browse){
  const owner=$('#owner').value.trim();if(!owner){status('Enter whose photos these are first.',true);$('#owner').focus();return;}
  const d=await api(`/api/collections/${cid}/sources`,{method:'POST',body:JSON.stringify({owner,path:browse?'':$('#path').value.trim(),browse})});
  if(d.cancelled)return; if(d.error){status(d.error,true);return;}
  $('#path').value='';$('#owner').value='';status('Source added. Index photos to read it.');loadSources();
}
$('#browse').onclick=()=>addSource(true);
$('#add').onclick=()=>addSource(false);

function status(msg,bad){$('#status').textContent=msg;$('#status').style.color=bad?'var(--bad)':'';}
$('#index').onclick=async()=>{const d=await api(`/api/collections/${cid}/index`,{method:'POST'});
  if(d.error){status(d.error,true);return;} checkJob();};
async function checkJob(){
  clearTimeout(polling);
  const j=await api(`/api/collections/${cid}/index`);
  if(j.collection!==cid&&!j.running){status('');$('#fill').style.width='0';return;}
  $('#fill').style.width=(j.progress||0)+'%';status(j.status||'',!!j.error);
  $('#index').disabled=j.running;
  if(j.running){polling=setTimeout(checkJob,400);} else if(j.result){loadSources();loadTimeline();loadCollectionsQuiet();}
}
async function loadCollectionsQuiet(){const d=await api('/api/collections');const cur=cid;
  $('#coll').innerHTML=(d.collections||[]).map(c=>`<option value="${esc(c.id)}">${esc(c.name)} (${c.assets})</option>`).join('');$('#coll').value=cur;}

function fmtOffset(m){if(m==null)return'';const s=m<0?'-':'+',a=Math.abs(m);return `${s}${String(a/60|0).padStart(2,'0')}:${String(a%60).padStart(2,'0')}`;}
function localParts(it){
  if(it.local_time){const [d,t]=it.local_time.split('T');return{day:d,time:t.slice(0,8),hour:t.slice(0,2)};}
  if(it.utc_time){const [d,t]=it.utc_time.replace('Z','').split('T');return{day:d,time:t.slice(0,8),hour:t.slice(0,2)};}
  return{day:'unknown',time:'?',hour:'--'};
}
function dayTitle(d){if(d==='unknown')return'No date';const dt=new Date(d+'T12:00:00');
  return dt.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});}

async function loadTimeline(){
  if(!cid)return;
  data=await api(`/api/collections/${cid}/timeline`);
  const items=data.items||[];
  if(!items.length){$('#main').innerHTML=`<div class="empty"><strong>Nothing indexed yet</strong>Add a source folder for each person or device, then choose Index photos.</div>`;return;}
  const s=data.summary, byOwner={};
  items.forEach(i=>{(byOwner[i.source_id]??={owner:i.owner,n:0,devices:new Set()}).n++;byOwner[i.source_id].devices.add(i.device);});
  let html=`<div class="summary"><span class="big">${items.length} photos and videos</span>
    <span class="legend">${Object.entries(byOwner).map(([id,o])=>`<span class="chip"><span class="swatch" style="background:${lane(+id)}"></span>${esc(o.owner)} · ${o.n}<span style="color:var(--muted)">${esc([...o.devices].join(', '))}</span></span>`).join('')}</span></div>
    <div class="conf">${['high','medium','low','unknown'].filter(c=>s.by_confidence[c]).map(c=>`<span class="pill ${c}">${s.by_confidence[c]} ${esc(CONF_TEXT[c].toLowerCase())}</span>`).join('')}
    ${Object.entries(s.relationships||{}).map(([k,n])=>`<span class="chip">${n} ${k==='live_photo'?'Live Photo pairs':k==='raw_jpeg'?'RAW+JPEG pairs':'possible Live Photo pairs'}</span>`).join('')}</div>`;
  let day=null,hour=null;
  items.forEach((it,idx)=>{
    const p=localParts(it);
    if(p.day!==day){if(day!==null)html+='</div></div></div></section>';day=p.day;hour=null;
      const n=items.filter(x=>localParts(x).day===day).length;
      html+=`<section class="day"><h3>${esc(dayTitle(day))}<small>${n} items</small></h3><div>`;}
    if(p.hour!==hour){if(hour!==null)html+='</div></div>';hour=p.hour;html+=`<div class="hour"><div class="h">${esc(hour)}:00</div><div class="tiles">`;}
    const thumb=it.kind==='image'?`<img class="img" loading="lazy" alt="" src="/api/thumb?path=${encodeURIComponent(it.path)}&v=2">`:`<span class="vid">Video ${esc(it.ext)}</span>`;
    const flag=it.exact_copies?'<span class="flag">exact copy</span>':(it.related.length?`<span class="flag">${it.related[0].kind==='raw_jpeg'?'RAW+JPEG':'Live'}</span>`:'');
    html+=`<button class="tile ${esc(it.confidence)}" data-i="${idx}" style="--lane:${lane(it.source_id)}" title="${esc(it.filename)}">${thumb}${flag}
      <span class="meta"><span class="t">${esc(p.time)}</span><span class="who">${esc(it.owner)}</span></span></button>`;
  });
  html+='</div></div></div></section>';
  $('#main').innerHTML=html;
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>showDetail(+t.dataset.i,t));
}

function showDetail(i,el){
  const it=data.items[i];document.querySelectorAll('.tile.sel').forEach(t=>t.classList.remove('sel'));el.classList.add('sel');
  const p=localParts(it);
  $('#detail').innerHTML=`<button class="iconbtn" id="close" style="float:right">Close</button>
    <h3 style="margin:0 0 10px;font-size:15px;word-break:break-all">${esc(it.filename)}</h3>
    ${it.kind==='image'?`<img alt="" src="/api/thumb?path=${encodeURIComponent(it.path)}&v=2">`:''}
    <dl>
      <dt>Capture time</dt><dd>${esc(p.day)} ${esc(p.time)} ${it.offset_minutes!=null?esc(fmtOffset(it.offset_minutes)):'(time zone unknown)'}</dd>
      <dt>UTC</dt><dd>${esc(it.utc_time||'unknown')}</dd>
      <dt>Confidence</dt><dd><span class="pill ${esc(it.confidence)}">${esc(it.confidence)}</span> ${esc(CONF_TEXT[it.confidence]||'')}</dd>
      <dt>Rule</dt><dd>${esc(it.rule||'')}</dd>
      <dt>Source</dt><dd>${esc(it.owner)}</dd>
      <dt>Device</dt><dd>${esc(it.device)}</dd>
      <dt>Size</dt><dd>${it.width&&it.height?esc(it.width+' × '+it.height):'unknown'}</dd>
      <dt>GPS</dt><dd>${it.gps?esc(it.gps.map(v=>v.toFixed(5)).join(', ')):'none'}</dd>
      <dt>File</dt><dd>${esc(it.path)}</dd>
      ${it.exact_copies?`<dt>Exact copies</dt><dd>${it.exact_copies} other file(s) with identical bytes</dd>`:''}
      ${it.related.length?`<dt>Paired with</dt><dd>${it.related.map(r=>esc(r.kind)+' #'+r.with).join(', ')}</dd>`:''}
    </dl>
    ${it.notes.length?`<div style="font-size:13px;color:var(--muted)">How this time was decided</div><ul>${it.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}`;
  $('#detail').classList.add('open');$('#close').onclick=()=>{$('#detail').classList.remove('open');el.classList.remove('sel');el.focus();};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#detail').classList.contains('open'))$('#close').click();});
loadCollections();
</script>
</body></html>
