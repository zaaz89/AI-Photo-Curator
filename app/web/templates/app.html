<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Curator</title>
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Navigation">
    <div class="brand">Photo Curator</div>
    <label class="sr" for="coll" data-t="collection">Collection</label>
    <select id="coll" class="coll"></select>
    <nav id="nav"></nav>
    <div class="job">
      <div class="bar"><div id="fill"></div></div>
      <div id="status" class="status" aria-live="polite"></div>
      <button class="btn primary" id="indexBtn" data-t="index">Index photos</button>
      <button class="btn" id="describeBtn" data-t="describe">Describe with local AI</button>
    </div>
  </aside>
  <section class="content">
    <header class="toolbar">
      <h1 id="title"></h1>
      <span class="spacer"></span>
      <form id="searchForm" class="search" role="search">
        <input type="search" id="q" data-tp="searchPh" placeholder="Search photos" aria-label="Search photos">
      </form>
      <label class="zoom" title="Thumbnail size"><span class="sr" data-t="thumbSize">Thumbnail size</span>
        <input type="range" id="zoom" min="100" max="320" step="20" value="160"></label>
    </header>
    <div id="tools" class="tools"></div>
    <main id="main" tabindex="-1"></main>
  </section>
  <aside id="inspector" class="inspector" aria-label="Photo details" hidden></aside>
</div>
<div id="quicklook" class="quicklook" hidden><img alt=""><div class="qlbar"></div></div>
<script src="/ui/app.js"></script>
</body></html>
